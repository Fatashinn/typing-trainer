<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр знаков</title>
<style>
:root {
  --bg: #f7f7f5;
  --panel: #ffffff;
  --fg: #1f2328;
  --muted: #6b7078;
  --border: #d9dbde;
  --accent: #2f6fd6;
  --done: #9aa0a6;
  --cur-bg: #dfe9fb;
  --err: #c62828;
  --err-bg: #fde3e3;
  --warn: #a45a00;
  --warn-bg: #fff1d6;
  --ok: #2e7d32;
  --ring: #1f2328;
  --key-fg: #1f2328;
  --key-alt: rgba(31, 35, 40, .5);
  --en-mark: #2f6fd6;
  --f-lp: #98bf84;
  --f-lr: #bcbc4a;
  --f-lm: #f0bf50;
  --f-li: #8ba69a;
  --f-ri: #c98898;
  --f-rm: #f0bf50;
  --f-rr: #bcbc4a;
  --f-rp: #98bf84;
  --f-th: #c86a5a;
  --row-bad: #fde3e3;
  --row-mid: #fff1d6;
  --row-good: #e5f3e6;
  --case-top: #e7e8ea;
  --case-bottom: #cdd0d4;
  --case-edge: rgba(0, 0, 0, .1);
  --key-shadow: rgba(0, 0, 0, .28);
  --key-neutral: #f6f6f7;
  --pale: rgba(255, 255, 255, .5);
  --caps-off: rgba(0, 0, 0, .25);
  --touch-ring: rgba(0, 0, 0, .35);
  --flash-ok: rgba(0, 0, 0, .3);
  --flash-bad: #e53935;
  --flash-warn: #f2c200;
  --rep-bg: #ece5fb;
  --fast: #d9730d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17191c;
    --panel: #202328;
    --fg: #e6e8eb;
    --muted: #9aa0a8;
    --border: #353a41;
    --accent: #7aa7f0;
    --done: #6b7179;
    --cur-bg: #2c3d5c;
    --err: #ff7b72;
    --err-bg: #4a2323;
    --warn: #f0b35a;
    --warn-bg: #43341b;
    --ok: #7bc47f;
    --ring: #ffffff;
    --key-fg: #eef0f2;
    --key-alt: rgba(238, 240, 242, .55);
    --en-mark: #7aa7f0;
    --f-lp: #4f6845;
    --f-lr: #66662a;
    --f-lm: #85692c;
    --f-li: #4b5f56;
    --f-ri: #744a58;
    --f-rm: #85692c;
    --f-rr: #66662a;
    --f-rp: #4f6845;
    --f-th: #743d33;
    --row-bad: #4a2323;
    --row-mid: #43341b;
    --row-good: #1f3a22;
    --case-top: #36393e;
    --case-bottom: #2a2c30;
    --case-edge: rgba(255, 255, 255, .07);
    --key-shadow: rgba(0, 0, 0, .6);
    --key-neutral: #46494f;
    --pale: rgba(23, 25, 28, .5);
    --caps-off: rgba(255, 255, 255, .25);
    --touch-ring: rgba(255, 255, 255, .4);
    --flash-ok: rgba(0, 0, 0, .45);
    --flash-bad: #ff5a52;
    --flash-warn: #ffd23f;
    --rep-bg: #3a3152;
    --fast: #f0a050;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.wrap { max-width: 920px; margin: 0 auto; padding: 12px 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
h1 { font-size: 18px; margin: 0; font-weight: 600; }
button, select, input, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 10px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { button.primary { color: #10141a; } }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { .seg button[aria-pressed="true"] { color: #10141a; } }
.tabs { margin-left: auto; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.hidden { display: none !important; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* trainer */
#modeOpts { margin: 10px 0 0; }
#modeOpts:empty { display: none; }
details summary { cursor: pointer; color: var(--muted); }
.syms { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 8px; }
.syms label { display: inline-flex; align-items: center; gap: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
textarea { width: 100%; min-height: 90px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
#textBox {
  margin-top: 12px; min-height: 150px; position: relative;
  font-size: 23px; line-height: 1.6; letter-spacing: .02em;
}
#text { white-space: pre-wrap; overflow-wrap: break-word; }
#text span.d { color: var(--done); }
#text span.rep { background: var(--rep-bg); }
#text span.fast { color: var(--fast); }
#text span.d.x { color: var(--err); }
#text span.c { background: var(--cur-bg); border-bottom: 2px solid var(--accent); }
#text span.c.bad { background: var(--err-bg); border-bottom-color: var(--err); }
#text span.en { text-decoration: underline dotted var(--en-mark); text-underline-offset: 5px; }
#result { text-align: center; padding: 10px 0; }
#result .big { font-size: 34px; font-weight: 600; }
#result .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 28px; margin: 8px 0 14px; }
#result .grid div span { display: block; font-size: 13px; color: var(--muted); }
#status { min-height: 26px; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; }
#msg { padding: 1px 8px; border-radius: 4px; }
#msg.err { background: var(--err-bg); color: var(--err); }
#msg.warn { background: var(--warn-bg); color: var(--warn); }
#live { margin-left: auto; color: var(--muted); }

/* daily training */
#dailyRow { margin-bottom: 8px; }
#streak b { color: var(--fg); }
#streak .miss { color: var(--warn); }
#dailyBar { margin-top: 10px; padding: 8px 12px; font-size: 14px; }
#dailyBar .bar { height: 6px; border-radius: 3px; background: var(--border); margin-top: 6px; overflow: hidden; }
#dailyBar .bar div { height: 100%; background: var(--accent); }
#dailyBar .t { font-variant-numeric: tabular-nums; font-weight: 600; }
.densRow { margin-top: 6px; }
.densRow input { vertical-align: middle; }

/* keyboard */
#kbWrap { margin-top: 10px; container-type: inline-size; }
#kbWrap.colors .key .m, #kbWrap.colors .key .alt { visibility: hidden; }
#reportOut { margin-top: 8px; min-height: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
#reportMsg { margin-left: 8px; }
#reportMsg.ok { color: var(--ok); } #reportMsg.err { color: var(--err); }
#textBox.nohint #text span.en { text-decoration: none; }
.quick { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.quick select { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 14px; }
#kbCase {
  padding: 1.1cqw; border-radius: 1.8cqw;
  background: linear-gradient(180deg, var(--case-top), var(--case-bottom));
  box-shadow: inset 0 0 0 1px var(--case-edge);
}
#kb { position: relative; width: 100%; aspect-ratio: 14.5 / 6; }
.key {
  position: absolute; border-radius: .8cqw; color: var(--key-fg);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.4cqw; line-height: 1.05; user-select: none;
  box-shadow: 0 .22cqw 0 var(--key-shadow);
}
.key.down { transform: translateY(.22cqw); box-shadow: none; filter: brightness(.86); }
.key.frow::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--pale); pointer-events: none; }
.key .m { display: flex; flex-direction: column; align-items: center; }
.key .m.one { font-size: 2.8cqw; }
.key .alt {
  position: absolute; top: .35cqw; right: .55cqw;
  font-size: 1.4cqw; line-height: 1.05; color: var(--key-alt);
  display: flex; flex-direction: column; align-items: flex-end;
}
.key .lbl { position: absolute; font-size: 1.25cqw; line-height: 1; opacity: .85; white-space: nowrap; }
.lbl.bl { left: .65cqw; bottom: .55cqw; } .lbl.br { right: .65cqw; bottom: .55cqw; }
.lbl.tl { left: .65cqw; top: .55cqw; } .lbl.tr { right: .65cqw; top: .55cqw; }
.key .lbl.c { position: static; }
.key .lbl.ar { position: static; font-size: .95cqw; }
.capsdot { position: absolute; left: .65cqw; top: .65cqw; width: .55cqw; height: .55cqw; border-radius: 50%; background: var(--caps-off); }
.key.caps-on .capsdot { background: #3ddc5a; box-shadow: 0 0 .45cqw #3ddc5a; }
.touchid { width: 3.2cqw; height: 3.2cqw; border-radius: 50%; border: .2cqw solid var(--touch-ring); }
.key.next { outline: .45cqw solid var(--ring); outline-offset: .15cqw; z-index: 2; }
.f-none { background: var(--key-neutral); }
.f-lp { background: var(--f-lp); } .f-lr { background: var(--f-lr); }
.f-lm { background: var(--f-lm); } .f-li { background: var(--f-li); }
.f-ri { background: var(--f-ri); } .f-rm { background: var(--f-rm); }
.f-rr { background: var(--f-rr); } .f-rp { background: var(--f-rp); }
.f-th { background: var(--f-th); }
/* short flash after a key press: grey dimming ok, red wrong key, yellow layout/Shift */
.key.fl-ok { --fl: var(--flash-ok); } .key.fl-bad { --fl: var(--flash-bad); } .key.fl-warn { --fl: var(--flash-warn); }
.key.fl::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
  background: var(--fl); opacity: 0; animation: keyflash 250ms ease-out;
}
@keyframes keyflash { from { opacity: .85; } to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .key.fl::before { animation: none; opacity: 1; background: none; box-shadow: inset 0 0 0 .4cqw var(--fl); }
}
#hint { margin-top: 10px; text-align: center; font-size: 16px; min-height: 24px; }
#hint b { font-size: 19px; padding: 0 4px; }

/* stats */
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); }
td.ch { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; }
tr.bad td { background: var(--row-bad); }
tr.mid td { background: var(--row-mid); }
tr.good td { background: var(--row-good); }
.tscroll { overflow-x: auto; }
h2 { font-size: 16px; margin: 18px 0 8px; }
h2:first-child { margin-top: 0; }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.settings label { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0; }
.settings p { margin: 2px 0 0 26px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Тренажёр знаков</h1>
    <div class="seg tabs" id="tabs">
      <button data-tab="train" aria-pressed="true">Тренировка</button>
      <button data-tab="stats" aria-pressed="false">Статистика</button>
      <button data-tab="settings" aria-pressed="false">Настройки</button>
    </div>
  </header>

  <section id="tab-train">
    <div class="row" id="dailyRow">
      <button class="primary" id="dailyBtn">Тренировка дня</button>
      <span id="streak" class="muted small"></span>
    </div>
    <div class="row">
      <div class="seg" id="modes">
        <button data-mode="digits">Цифры</button>
        <button data-mode="weak">Слабые места</button>
        <button data-mode="symRU">Знаки RU</button>
        <button data-mode="symEN">Знаки EN</button>
        <button data-mode="mixed">Смешанный</button>
        <button data-mode="custom">Свой текст</button>
      </div>
      <div class="row" style="gap:8px">
      <button id="newBtn" title="Esc">Новый текст</button>
      <label class="quick">Подсказка
        <select id="hintSel" data-quick="1">
          <option value="full">полная</option>
          <option value="demand">по запросу</option>
          <option value="none">без подсказок</option>
        </select></label>
      <label class="quick">Клавиатура
        <select id="kbSel" data-quick="1">
          <option value="labels">с подписями</option>
          <option value="colors">только цвета</option>
          <option value="hidden">скрыта</option>
        </select></label>
      </div>
    </div>
    <div id="modeOpts"></div>
    <div class="panel hidden" id="dailyBar"></div>
    <div class="panel" id="textBox">
      <div id="text"></div>
      <div id="result" class="hidden"></div>
    </div>
    <div id="status"><span id="msg"></span><span id="live"></span></div>
    <div id="kbWrap"><div id="kbCase"><div id="kb"></div></div></div>
    <div id="hint"></div>
  </section>

  <section id="tab-stats" class="hidden">
    <div class="panel">
      <h2>Отчёт для Claude</h2>
      <p class="muted small" style="margin:0 0 8px">Короткая сводка простым текстом: вставь её в чат с Claude и попроси советов.</p>
      <div><button class="primary" id="reportBtn">Отчёт для Claude</button><span id="reportMsg"></span></div>
      <textarea id="reportOut" class="hidden" readonly></textarea>
      <h2>По символам</h2>
      <div class="row small" style="margin-bottom:8px">
        <label>Раскладка:
          <select id="stLayout"><option value="">обе</option><option value="RU">RU</option><option value="EN">EN</option></select>
        </label>
        <label><input type="checkbox" id="stNoLetters" checked> только знаки и цифры</label>
      </div>
      <div class="tscroll"><table id="stTable"></table></div>
      <p class="muted small">Сверху — худшие. Красный: ошибок ≥ 15% или нажатие ≥ 1 с; жёлтый: ошибок ≥ 5% или ≥ 0,6 с. Паузы дольше 2 с не учитываются.</p>
      <h2>Последние уроки</h2>
      <div class="tscroll"><table id="histTable"></table></div>
      <h2>Сброс</h2>
      <div id="resetBox"></div>
    </div>
  </section>

  <section id="tab-settings" class="hidden">
    <div class="panel settings">
      <label><input type="checkbox" id="optStrict">
        <span><b>Строгий Shift</b><br><span class="muted small">Shift не той рукой — ошибка, курсор стоит. Если выключено — только предупреждение.</span></span></label>
      <label><input type="checkbox" id="optIso">
        <span><b>ISO-клавиатура</b> (лишняя клавиша слева от Z)<br><span class="muted small">На Mac с ISO браузер иногда путает коды клавиш слева от 1 и слева от Z. Тренажёр проверяет нажатие по символу, так что на проверку это не влияет.</span></span></label>
      <label><span><b>Раскладка в режиме «Цифры»</b>
        <select id="optDigitsLayout"><option value="RU">RU</option><option value="EN">EN</option></select><br>
        <span class="muted small">Влияет на подсказку и статистику. Знаки, общие для обеих раскладок, принимаются из любой.</span></span></label>
      <label><span><b>Потолок скорости</b>
        <select id="optCeiling"><option value="0">выкл</option><option>40</option><option>45</option><option>50</option>
          <option>55</option><option>60</option><option>65</option><option>70</option><option>75</option><option>80</option></select> wpm<br>
        <span class="muted small">Скорость считается по каждому слову. Слово быстрее потолка подсвечивается оранжевым и не входит в wpm урока: так видно, где гонишь в ущерб точности.</span></span></label>
      <label><span><b>Перепечатать слово с ошибкой</b>
        <select id="optRetype"><option value="0">выкл</option><option value="2">2 раза</option><option value="3">3 раза</option></select><br>
        <span class="muted small">После слова с ошибкой оно вставляется в текст ещё N раз подряд (выделено фоном).</span></span></label>
      <p class="muted small" id="storageNote"></p>
    </div>
  </section>
</div>

<script>
'use strict';

/* ---------- storage (works without localStorage) ---------- */
const store = {
  mem: {},
  get(k, def) {
    let raw = null;
    try { raw = window.localStorage.getItem(k); } catch (e) { raw = null; }
    if (raw == null && k in this.mem) raw = this.mem[k];
    if (raw == null) return def;
    try { return JSON.parse(raw); } catch (e) { return def; }
  },
  set(k, v) {
    const raw = JSON.stringify(v);
    this.mem[k] = raw;
    try { window.localStorage.setItem(k, raw); return true; } catch (e) { return false; }
  },
  del(k) {
    delete this.mem[k];
    try { window.localStorage.removeItem(k); } catch (e) { /* ignore */ }
  },
  works() {
    try { const t = '__tt_test'; window.localStorage.setItem(t, '1'); window.localStorage.removeItem(t); return true; }
    catch (e) { return false; }
  }
};
const K_SETTINGS = 'tt.settings', K_STATS = 'tt.stats', K_HIST = 'tt.history', K_CUSTOM = 'tt.custom', K_TOTALS = 'tt.totals';
const K_DAYS = 'tt.days', K_DAILY = 'tt.daily';

/* ---------- layouts ---------- */
const EN = {
  Backquote: ['`', '~'], Digit1: ['1', '!'], Digit2: ['2', '@'], Digit3: ['3', '#'], Digit4: ['4', '$'],
  Digit5: ['5', '%'], Digit6: ['6', '^'], Digit7: ['7', '&'], Digit8: ['8', '*'], Digit9: ['9', '('],
  Digit0: ['0', ')'], Minus: ['-', '_'], Equal: ['=', '+'], BracketLeft: ['[', '{'], BracketRight: [']', '}'],
  Backslash: ['\\', '|'], Semicolon: [';', ':'], Quote: ["'", '"'], Comma: [',', '<'], Period: ['.', '>'],
  Slash: ['/', '?'], IntlBackslash: ['\\', '|'], Space: [' ', ' ']
};
'qwertyuiopasdfghjklzxcvbnm'.split('').forEach(c => { EN['Key' + c.toUpperCase()] = [c, c.toUpperCase()]; });

const RU = {
  Backquote: ['ё', 'Ё'], Digit1: ['1', '!'], Digit2: ['2', '"'], Digit3: ['3', '№'], Digit4: ['4', ';'],
  Digit5: ['5', '%'], Digit6: ['6', ':'], Digit7: ['7', '?'], Digit8: ['8', '*'], Digit9: ['9', '('],
  Digit0: ['0', ')'], Minus: ['-', '_'], Equal: ['=', '+'], Slash: ['.', ','], Backslash: ['\\', '/'],
  IntlBackslash: ['\\', '/'], Space: [' ', ' ']
};
const RU_LETTERS = {
  KeyQ: 'й', KeyW: 'ц', KeyE: 'у', KeyR: 'к', KeyT: 'е', KeyY: 'н', KeyU: 'г', KeyI: 'ш', KeyO: 'щ', KeyP: 'з',
  BracketLeft: 'х', BracketRight: 'ъ', KeyA: 'ф', KeyS: 'ы', KeyD: 'в', KeyF: 'а', KeyG: 'п', KeyH: 'р',
  KeyJ: 'о', KeyK: 'л', KeyL: 'д', Semicolon: 'ж', Quote: 'э', KeyZ: 'я', KeyX: 'ч', KeyC: 'с', KeyV: 'м',
  KeyB: 'и', KeyN: 'т', KeyM: 'ь', Comma: 'б', Period: 'ю'
};
Object.keys(RU_LETTERS).forEach(code => { const c = RU_LETTERS[code]; RU[code] = [c, c.toUpperCase()]; });
const MAPS = { RU, EN };
const OTHER = { RU: 'EN', EN: 'RU' };

const FINGER_KEYS = {
  lp: 'Escape Backquote Digit1 KeyQ KeyA KeyZ Tab CapsLock ShiftLeft IntlBackslash Fn ControlLeft AltLeft',
  lr: 'F1 F2 Digit2 KeyW KeyS KeyX',
  lm: 'F3 F4 Digit3 KeyE KeyD KeyC',
  li: 'F5 F6 Digit4 Digit5 KeyR KeyT KeyF KeyG KeyV KeyB',
  ri: 'F7 F8 F9 Digit6 Digit7 KeyY KeyU KeyH KeyJ KeyN KeyM',
  rm: 'F10 F11 F12 Digit8 KeyI KeyK Comma',
  rr: 'Digit9 KeyO KeyL Period',
  rp: 'Digit0 Minus Equal KeyP BracketLeft BracketRight Backslash Semicolon Quote Slash Enter Backspace ShiftRight',
  th: 'Space MetaLeft MetaRight'
};
const FINGER = {};
Object.keys(FINGER_KEYS).forEach(f => FINGER_KEYS[f].split(' ').forEach(c => { FINGER[c] = f; }));
const FINGER_NAME = {
  lp: 'левый мизинец', lr: 'левый безымянный', lm: 'левый средний', li: 'левый указательный',
  ri: 'правый указательный', rm: 'правый средний', rr: 'правый безымянный', rp: 'правый мизинец', th: 'большой палец'
};

// MacBook Air M2 (ANSI, US): 14.5 units wide, 6 rows; the function row is full height
const KB_W = 14.5, KB_H = 6;
function geometry(iso) {
  const fw = (KB_W - 1.5 - 1) / 12;
  const rows = [
    [['Escape', 1.5], ...Array.from({ length: 12 }, (_, i) => ['F' + (i + 1), fw]), ['TouchID', 1]],

// one lesson of sentences: first word plain, then a symbol template in about every N-th word;
// toggles not yet seen in the lesson are preferred until each one has appeared
function buildSymLesson(L, en, enabled) {
  const g = globalAvgTime();
  const W = L === 'RU' ? WORDS_RU : WORDS_EN;
  const dens = Math.min(4, Math.max(1, +settings.density || 2));
  const tpls = symbolTemplates(L).filter(t => t.t.every(tg => en[tg]));
  const wOf = tg => { const cs = toggleChars(tg); return cs.reduce((a, c) => a + weakness(L, c, g), 0) / cs.length; };
  const tw = tpls.map(t => Math.max(...t.t.map(wOf)));
  const need = new Set(enabled.filter(t => !TERM_TOGGLES.includes(t) && tpls.some(x => x.t.includes(t))));
  const terms = TERM_TOGGLES.filter(t => en[t]);
  const needTerms = new Set(terms);
  const sentences = [];
  let len = 0;
  for (let guard = 0; guard < 40; guard++) {
    const parts = [pick(W)];
    const n = rint(4, 8);
    for (let i = 1; i < n; i++) {
      const slotsLeft = Math.max(1, (MAX_LEN - 20 - len - parts.join(' ').length) / 8);
      const p = Math.max(1 / dens, Math.min(1, need.size / slotsLeft));
      if (tpls.length && Math.random() < p) {
        let idx = tpls.map((t, k) => k);
        if (need.size) { const c = idx.filter(k => tpls[k].t.some(tg => need.has(tg))); if (c.length) idx = c; }
        const k = pickWeighted(idx, idx.map(k => tw[k]));

      const sentencesLeft = Math.max(1, Math.round((MAX_LEN - len) / 45));

    S.text = S.text.slice(0, end) + ins + S.text.slice(end);
    S.layouts.splice(end, 0, ...insL);
    for (let k = 0; k < ins.length; k++) if (ins[k] !== ' ') S.rep.add(end + k);
    changed = true;
  }
  if (changed) renderText();
}

// "..." apart from the single ".", digits together: {".": 9, "...": 1, ",": 4, "0-9": 12}
function countSyms(text) {
  const cnt = {};
  const ell = (text.match(/\.\.\./g) || []).length;
  if (ell) cnt['...'] = ell;
  for (const c of text.replace(/\.\.\./g, '')) {
    if (isLetter(c) || c === ' ') continue;
    const k = /[0-9]/.test(c) ? '0-9' : c;
    cnt[k] = (cnt[k] || 0) + 1;
  }
  return cnt;
}

// store the lesson (also a partly typed one when a daily block runs out of time)
function recordLesson() {
  const ms = Math.max(0, Math.round(S.lastT - S.startT));
  const effChars = S.pos - S.fastChars, effMs = ms - S.fastMs;
  const wpm = effChars > 0 && effMs > 0 ? Math.round(effChars / 5 / (effMs / 60000)) : 0;
  const acc = S.keys ? Math.round(1000 * S.correct / S.keys) / 10 : 100;
  history.push({
    t: Date.now(), mode: S.mode, chars: S.pos, wpm, acc, ms,
    errors: S.errors, layoutErr: S.layoutErr, shiftErr: S.shiftErr, shiftWarn: S.shiftWarn,
    fast: S.fastWords, cnt: countSyms(S.text.slice(0, S.pos))
  });
  if (history.length > 50) history = history.slice(-50);
  totals.lessons++;
  totals.ms += ms;
  const dk = dayKey(Date.now());
  days[dk] = (days[dk] || 0) + ms;
  if (daily && !daily.waiting) daily.blockMs += ms;
  saveStats();
  renderStreak();
  return { wpm, acc };
}

function finish() {
  S.done = true;
  const { wpm, acc } = recordLesson();
  update();
  $('text').classList.add('hidden');
  const r = $('result');
  r.classList.remove('hidden');
  r.innerHTML = `
    <div class="grid">
      <div><div class="big">${wpm}</div><span>wpm</span></div>
      <div><div class="big">${String(acc).replace('.', ',')}%</div><span>точность</span></div>
      <div><div class="big">${S.errors}</div><span>ошибок всего</span></div>
      <div><div class="big">${S.layoutErr}</div><span>ошибок раскладки</span></div>
      <div><div class="big">${S.shiftErr}</div><span>ошибок Shift${S.shiftWarn ? ` (+${S.shiftWarn} предупр.)` : ''}</span></div>
      ${+settings.ceiling ? `<div><div class="big">${S.fastWords}</div><span>слов быстрее потолка</span></div>` : ''}
    </div>
    <button class="primary" id="againBtn">Ещё</button>
    <div class="muted small" style="margin-top:6px">Enter или пробел — следующий урок</div>`;
  $('againBtn').onclick = () => startLesson();
  setMsg('', '');
}

// a screen between lessons: Enter / space / the button continue
function showScreen(html, cont) {
  if (S) { S.done = true; S.onContinue = cont; }
  clearTimeout(revealTimer);
  $('text').classList.add('hidden');
  const r = $('result');
  r.classList.remove('hidden');
  r.innerHTML = html + `<button class="primary" id="contBtn">Продолжить</button>
    <div class="muted small" style="margin-top:6px">Enter — продолжить</div>`;
  $('contBtn').onclick = e => { e.currentTarget.blur(); cont(); };
  setMsg('', '');
  update();
}

/* ---------- daily training ---------- */
let BLOCK_MS = 5 * 60000;
const DAY_GOAL_MS = 10 * 60000;
let daily = null;   // { blocks, idx, blockMs, waiting, prevMode, timer }
function shiftDay(key, delta) {
  const [y, m, d] = key.split('-').map(Number);
  return dayKey(new Date(y, m - 1, d + delta).getTime());
}
function streakInfo() {
  const today = dayKey(Date.now()), yest = shiftDay(today, -1);
  const ok = k => (days[k] || 0) >= DAY_GOAL_MS;
  let n = 0, k = ok(today) ? today : yest;
  while (ok(k)) { n++; k = shiftDay(k, -1); }
  const earlier = Object.keys(days).some(x => x < yest && days[x] > 0);
  return { streak: n, todayMs: days[today] || 0, yestMs: days[yest] || 0, missedYesterday: !ok(yest) && earlier };
}
function renderStreak() {
  const si = streakInfo();
  $('streak').innerHTML = `Дней подряд: <b>${si.streak}</b> · сегодня ${Math.floor(si.todayMs / 60000)} из 10 мин` +
    (si.missedYesterday ? ' · <span class="miss">вчера пропущено</span>' : '');
}
function dailyElapsed() {
  if (!daily) return 0;
  let cur = 0;
  if (!daily.waiting && S && S.startT && !S.done) cur = Math.max(0, Math.min(performance.now(), S.lastT + 5000) - S.startT);
  return daily.blockMs + cur;
}
const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return `${pad2(Math.floor(t / 60))}:${pad2(t % 60)}`; };
function renderDailyBar() {
  const bar = $('dailyBar');
  if (!daily) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  const el = Math.min(BLOCK_MS, dailyElapsed()), b = daily.blocks[Math.min(daily.idx, daily.blocks.length - 1)];
  const total = Math.min(100, Math.round(100 * (Math.min(daily.idx, daily.blocks.length) * BLOCK_MS + (daily.waiting ? 0 : el)) / (daily.blocks.length * BLOCK_MS)));
  bar.innerHTML = `<div class="row"><span><b>Тренировка дня</b> · блок ${Math.min(daily.idx + 1, daily.blocks.length)} из ${daily.blocks.length}: ${b.label}</span>
    <span>осталось <span class="t">${daily.waiting ? mmss(BLOCK_MS) : mmss(BLOCK_MS - el)}</span></span>
    <span class="muted">всего ${total}%</span><button id="dailyStop" style="margin-left:auto">Прервать</button></div>
    <div class="bar"><div style="width:${total}%"></div></div>`;
  $('dailyStop').onclick = e => { e.currentTarget.blur(); stopDaily(); startLesson(); };
}
function dailyTick() {
  if (!daily) return;
  if (!daily.waiting && dailyElapsed() >= BLOCK_MS) endBlock();
  renderDailyBar();
}
function startDaily() {
  stopDaily();
  const today = dayKey(Date.now());
  const d = store.get(K_DAILY, {});
  const lang = d.lastDate === today ? d.lastLang : (d.lastLang === 'RU' ? 'EN' : 'RU');
  store.set(K_DAILY, { lastDate: today, lastLang: lang });
  const weak = weakInfo().L ? { mode: 'weak', label: 'Слабые места' } : { mode: 'mixed', label: 'Смешанный (для «Слабых мест» пока мало данных)' };
  daily = {
    blocks: [{ mode: 'digits', label: 'Цифры' }, weak, { mode: 'sym' + lang, label: 'Знаки ' + lang }],
    idx: 0, blockMs: 0, waiting: true, prevMode: settings.mode
  };
  daily.timer = setInterval(dailyTick, 250);
  renderDailyBar();
  showScreen(`<div class="big" style="font-size:24px">Тренировка дня</div>
    <p>${daily.blocks.map(b => b.label).join(' → ')}, по 5 минут.<br><span class="muted small">Время идёт, только пока печатаешь.</span></p>`, startBlock);
}
function startBlock() {
  daily.waiting = false;
  daily.blockMs = 0;
  setMode(daily.blocks[daily.idx].mode);
  renderDailyBar();
}
function endBlock() {
  if (S && !S.done && S.startT && S.pos > 0) { S.done = true; recordLesson(); }
  daily.waiting = true;
  daily.idx++;
  if (daily.idx < daily.blocks.length) {
    const b = daily.blocks[daily.idx];
    showScreen(`<div class="big" style="font-size:24px">Блок ${daily.idx} из ${daily.blocks.length} готов</div>
      <p>Дальше: <b>${b.label}</b> — 5 мин.</p>`, startBlock);
  } else {
    const prev = daily.prevMode;
    clearInterval(daily.timer);
    daily = null;
    renderDailyBar();
    const si = streakInfo();
    showScreen(`<div class="big" style="font-size:24px">Тренировка дня завершена</div>
      <p>Дней подряд: <b>${si.streak}</b>. Сегодня ${Math.floor(si.todayMs / 60000)} мин.</p>`, () => setMode(prev));
  }
}
function stopDaily() {
  if (!daily) return;
  clearInterval(daily.timer);
  daily = null;
  renderDailyBar();
}

/* ---------- stats tab ---------- */
function renderStats() {
  const fL = $('stLayout').value, noLetters = $('stNoLetters').checked;

    const s = stats[k], L = k.slice(0, 2), ch = k.slice(3);
    return { L, ch, s, er: s.a ? s.e / s.a : 0, avg: s.n ? s.t / s.n : null };
  }).filter(r => r.s.a > 0 && (!fL || r.L === fL) && (!noLetters || (!isLetter(r.ch) && r.ch !== ' ')));
  rows.forEach(r => { r.score = r.er * 4 + (r.avg != null ? r.avg : g) / 1000; });

      const cells = [r.ch === ' ' ? '␣' : r.ch, r.L, how, r.s.a, `${r.s.e} (${Math.round(r.er * 100)}%)`, r.s.le, r.s.se,
        avg != null ? Math.round(avg) + ' мс' : '—'];

      });
      h.appendChild(tr);
    });
  }
  renderReset(false);

/* ---------- report for Claude ---------- */
const MODE_NAMES = { digits: 'Цифры', weak: 'Слабые места', symRU: 'Знаки RU', symEN: 'Знаки EN', mixed: 'Смешанный', custom: 'Свой текст' };
const HINT_NAMES = { full: 'полная', demand: 'по запросу', none: 'без подсказок' };
const KB_NAMES = { labels: 'с подписями', colors: 'только цвета', hidden: 'скрыта' };
const qch = c => c === ' ' ? 'пробел' : '«' + c + '»';
const fmt1 = n => String(Math.round(n * 10) / 10).replace('.', ',');
const ddmm = t => { const d = new Date(t); return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
// physical key by the US label, e.g. "Shift+6"
function keyLabel(ch, L) {
  const k = keyFor(ch, L);
  if (!k) return '?';
  const name = k.code === 'Space' ? 'пробел' : EN[k.code][0].toUpperCase();
  return (k.shift ? 'Shift+' : '') + name;
}

function buildReport(lim) {
  const out = [];
  const now = Date.now(), d = new Date(now);
  const week = history.filter(x => now - x.t <= 7 * 864e5);
  const mins = ms => Math.round(ms / 60000);
  out.push(`# Тренажёр знаков: отчёт ${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`);
  out.push(`Раскладки: Russian – PC и English (US), MacBook. Клавиши указаны по US-маркировке; Shift нужен противоположной рукой.`);
  out.push(`Уроков всего: ${totals.lessons} (~${mins(totals.ms)} мин); за 7 дней: ${week.length} (~${mins(week.reduce((a, x) => a + lessonMs(x), 0))} мин).`);
  if (totals.lessons < 5) out.push(`Данных мало: меньше 5 уроков, выводы предварительные.`);
  out.push('', '## Настройки');
  out.push(`Строгий Shift: ${settings.strict ? 'вкл' : 'выкл'}. Клавиатура ${settings.iso ? 'ISO' : 'ANSI'}. ` +
    `Потолок скорости: ${+settings.ceiling ? settings.ceiling + ' wpm' : 'выкл'}. Перепечатка слова с ошибкой: ${+settings.retype ? settings.retype + ' раза' : 'выкл'}. Плотность знаков: в каждом ${settings.density}-м слове.`);
  out.push('Подсказка / клавиатура: ' + Object.keys(MODE_NAMES).map(m =>
    `${MODE_NAMES[m]}: ${HINT_NAMES[settings.hint[m]]} / ${KB_NAMES[settings.kbView[m]]}`).join('; ') + '.');

  const si = streakInfo();
  out.push('', '## Тренировка дня');
  out.push(`Дней подряд: ${si.streak} (день засчитывается от 10 мин). Сегодня ${mins(si.todayMs)} мин; вчера ${si.missedYesterday ? 'пропущено' : mins(si.yestMs) + ' мин'}.`);
  const today = dayKey(now);
  out.push('Минуты за 7 дней: ' + [6, 5, 4, 3, 2, 1, 0].map(k => { const dk = shiftDay(today, -k); return `${dk.slice(8)}.${dk.slice(5, 7)} ${mins(days[dk] || 0)}`; }).join(', ') + '.');

  out.push('', '## Режимы: последние 10 уроков (предыдущие 10)');
  const avg = (arr, f) => arr.reduce((a, x) => a + f(x), 0) / arr.length;
  let anyMode = false;
  Object.keys(MODE_NAMES).forEach(m => {
    const hs = history.filter(x => x.mode === m);
    if (!hs.length) return;
    anyMode = true;
    const last = hs.slice(-10), prev = hs.slice(-20, -10);
    let line = `- ${MODE_NAMES[m]}: ${Math.round(avg(last, x => x.wpm))} wpm, ${fmt1(avg(last, x => x.acc))}%`;
    line += prev.length ? ` (было ${Math.round(avg(prev, x => x.wpm))} wpm, ${fmt1(avg(prev, x => x.acc))}%)` : ' (раньше уроков не было)';
    out.push(line + `, уроков ${hs.length}`);
  });
  if (!anyMode) out.push('Уроков пока нет.');

  const rows = Object.keys(stats).map(k => {
    const s = stats[k];
    return { L: k.slice(0, 2), ch: k.slice(3), s, er: s.a ? s.e / s.a : 0, avg: s.n ? s.t / s.n : null };
  });
  const g = globalAvgTime();
  ['RU', 'EN'].forEach(L => {
    const w = rows.filter(r => r.L === L && r.s.a >= 3 && !isLetter(r.ch) && r.ch !== ' ')
      .map(r => Object.assign(r, { score: r.er * 4 + (r.avg != null ? r.avg : g) / 1000 }))
      .sort((a, b) => b.score - a.score).slice(0, lim.worst);
    out.push('', `## Худшие знаки ${L} (символ, клавиша: попыток / ошибок / мс)`);
    if (!w.length) out.push('Мало данных.');
    w.forEach(r => out.push(`${qch(r.ch)} (${keyLabel(r.ch, L)}): ${r.s.a} / ${Math.round(r.er * 100)}% / ${r.avg != null ? Math.round(r.avg) : '—'}`));
  });

  const avgT = f => { let t = 0, n = 0; rows.forEach(r => { if (f(r.ch)) { t += r.s.t || 0; n += r.s.n || 0; } }); return n ? Math.round(t / n) + ' мс' : '—'; };
  out.push('', '## Среднее время нажатия');
  out.push(`Буква ${avgT(isLetter)}, знак ${avgT(c => !isLetter(c) && c !== ' ' && !/[0-9]/.test(c))}, цифра ${avgT(c => /[0-9]/.test(c))}.`);
  ['RU', 'EN'].forEach(L => {
    const hs = history.filter(x => x.mode === 'sym' + L && x.cnt).slice(-10);
    if (!hs.length) return;
    const en = settings['sym' + L];
    const sum = k => hs.reduce((a, x) => a + (x.cnt[k] || 0), 0);
    const items = [];
    SYM_TOGGLES[L].filter(t => en[t]).forEach(t => {
      if (t === '.') { items.push(`«.» ${sum('.')}`, `«...» ${sum('...')}`); return; }
      if (t === '0-9') { items.push(`цифры ${sum('0-9')}`); return; }
      const cs = toggleChars(t);
      items.push(`«${t}» ${cs.length > 1 ? Math.min(...cs.map(sum)) : sum(t)}`);
    });
    out.push('', `## Знаки ${L}: сколько раз встретились (последние ${hs.length} ур.)`, items.join(', ') + '.');
  });

  const conf = [];
  rows.forEach(r => { if (r.s.x) Object.keys(r.s.x).forEach(p => conf.push({ r, p, n: r.s.x[p] })); });
  conf.sort((a, b) => b.n - a.n);
  out.push('', '## Частые путаницы (ожидалось → нажато)');
  if (!conf.length) out.push('Пока не записаны.');
  conf.slice(0, 10).forEach(c => out.push(`${qch(c.r.ch)} ${c.r.L} → ${qch(c.p)}: ${c.n}`));

  const top = (f, n) => rows.filter(r => f(r) > 0).sort((a, b) => f(b) - f(a)).slice(0, n);
  const le = rows.reduce((a, r) => a + (r.s.le || 0), 0);
  out.push('', '## Ошибки раскладки');
  out.push(le ? `Всего ${le}. Чаще всего: ` + top(r => r.s.le || 0, 6).map(r => `${qch(r.ch)} ${r.L} ${r.s.le}`).join(', ') + '.' : 'Нет.');

  const se = rows.reduce((a, r) => a + (r.s.se || 0), 0);
  out.push('', '## Ошибки Shift');
  out.push(se ? `Всего ${se}. Чаще всего: ` + top(r => r.s.se || 0, 6).map(r => `${qch(r.ch)} ${r.L} ${r.s.se}`).join(', ') + '.' : 'Нет.');
  const sx = [];
  rows.forEach(r => { if (r.s.sx) Object.keys(r.s.sx).forEach(side => sx.push({ r, side, n: r.s.sx[side] })); });
  sx.sort((a, b) => b.n - a.n).slice(0, 6).forEach(x =>
    out.push(`${qch(x.r.ch)} ${x.r.L}: ${x.side === 'R' ? 'правый вместо левого' : 'левый вместо правого'}: ${x.n}`));

  out.push('', `## Последние уроки (${Math.min(lim.lessons, history.length)})`);
  if (!history.length) out.push('Пока нет.');
  history.slice(-lim.lessons).reverse().forEach(x => out.push(
    `${ddmm(x.t)} ${MODE_NAMES[x.mode] || x.mode}: ${x.wpm} wpm, ${fmt1(x.acc)}%, раскладка ${x.layoutErr}, Shift ${x.shiftErr}` +
    (x.fast ? `, быстрых слов ${x.fast}` : '')));
  return out.join('\n');
}
// keep the report under ~3000 chars by shortening the lists
function makeReport() {
  const steps = [{ worst: 15, lessons: 15 }, { worst: 12, lessons: 12 }, { worst: 10, lessons: 10 }, { worst: 7, lessons: 8 }, { worst: 5, lessons: 5 }];
  let t = '';
  for (const lim of steps) { t = buildReport(lim); if (t.length <= 3000) return t; }
  return t.slice(0, 3000);
}
function onReportClick() {
  const text = makeReport();
  const msg = $('reportMsg'), out = $('reportOut');
  const manual = () => {
    out.value = text;
    out.classList.remove('hidden');
    out.focus();
    out.select();
    msg.textContent = 'Скопируй вручную: Cmd+C';
    msg.className = 'err';
  };
  const ok = () => { out.classList.add('hidden'); msg.textContent = 'Скопировано'; msg.className = 'ok'; };
  try {
    if (!navigator.clipboard || !navigator.clipboard.writeText) return manual();
    navigator.clipboard.writeText(text).then(ok, manual);
  } catch (e) { manual(); }
}

/* ---------- tabs & init ---------- */
function setTab(t) {
  tab = t;
  for (const b of $('tabs').children) b.setAttribute('aria-pressed', String(b.dataset.tab === t));
  ['train', 'stats', 'settings'].forEach(x => $('tab-' + x).classList.toggle('hidden', x !== t));
  if (t === 'stats') renderStats();
}

function init() {
  $('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { setTab(b.dataset.tab); b.blur(); } });
  $('modes').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { stopDaily(); setMode(b.dataset.mode); b.blur(); } });
  $('dailyBtn').onclick = e => { e.currentTarget.blur(); startDaily(); };
  $('optCeiling').value = String(settings.ceiling);
  $('optCeiling').onchange = e => { settings.ceiling = +e.target.value; saveSettings(); };
  $('optRetype').value = String(settings.retype);
  $('optRetype').onchange = e => { settings.retype = +e.target.value; saveSettings(); };
  $('newBtn').onclick = e => { e.currentTarget.blur(); startLesson(); };
  $('hintSel').onchange = e => {
    settings.hint[settings.mode] = e.target.value; saveSettings(); e.target.blur(); applyView();
    if (S && !S.done) { armReveal(); update(); }
  };
  $('kbSel').onchange = e => { settings.kbView[settings.mode] = e.target.value; saveSettings(); e.target.blur(); applyView(); };
  $('reportBtn').onclick = onReportClick;
  $('stLayout').onchange = renderStats;
  $('stNoLetters').onchange = renderStats;
  $('optStrict').checked = settings.strict;
  $('optStrict').onchange = e => { settings.strict = e.target.checked; saveSettings(); };
  $('optIso').checked = settings.iso;
  $('optIso').onchange = e => { settings.iso = e.target.checked; saveSettings(); buildKeyboard(); update(); };
  $('optDigitsLayout').value = settings.digitsLayout;
  $('optDigitsLayout').onchange = e => { settings.digitsLayout = e.target.value; saveSettings(); if (settings.mode === 'digits') startLesson(); };
  if (!store.works()) $('storageNote').textContent = 'localStorage недоступен: статистика и настройки не сохранятся после закрытия страницы.';
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  // after Cmd+Tab no keyup arrives: drop every key that looks held
  window.addEventListener('blur', () => { shiftL = shiftR = false; releaseAll(); });
  document.addEventListener('visibilitychange', () => { shiftL = shiftR = false; releaseAll(); if (document.hidden) saveStats(); });
  window.addEventListener('pagehide', saveStats);
  buildKeyboard();
  renderStreak();
  setMode(settings.mode);
}
init();

// hooks for automated tests
window.__tt = {
  get state() { return S; }, get settings() { return settings; }, get stats() { return stats; },
  load: text => startLesson(text), generate, typeable, assignLayouts, report: makeReport,
  get daily() { return daily; }, get days() { return days; }, get weak() { return weakState; },
  setBlockMs: ms => { BLOCK_MS = ms; }, tick: dailyTick, streakInfo, symLessonOk
};
